<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - SMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2>🎓 SMS Portal</h2>
        <ul>
            <li><a href="index.html">🏠 Dashboard</a></li>
            <li><a href="students.html" class="active">👨‍🎓 Students</a></li>
            <li><a href="#">📅 Attendance</a></li>
            <li><a href="#">📚 Courses</a></li>
            <li><a href="#">📝 Marks</a></li>
            <li><a href="#">🔐 Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Student Management</h1>

        <!-- Add Student Form -->
        <div class="form-container" style="background: white; padding: 20px; border-radius: 8px; margin-top: 20px;">
            <h2>Add New Student</h2>
            <form id="student-form" style="display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;">
                <input type="text" placeholder="Full Name" required style="padding: 10px; flex: 1;">
                <input type="email" placeholder="Email" required style="padding: 10px; flex: 1;">
                <input type="text" placeholder="Roll No" required style="padding: 10px; flex: 1;">
                <input type="text" placeholder="Class/Course" required style="padding: 10px; flex: 1;">
                <button type="submit" style="padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer;">Add Student</button>
            </form>
        </div>

        <!-- Students List Table -->
        <div class="table-container" style="background: white; padding: 20px; border-radius: 8px; margin-top: 30px;">
            <h2>Student List</h2>
            <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                <thead>
                    <tr style="background: #2c3e50; color: white; text-align: left;">
                        <th style="padding: 10px;">Roll No</th>
                        <th style="padding: 10px;">Name</th>
                        <th style="padding: 10px;">Email</th>
                        <th style="padding: 10px;">Class</th>
                        <th style="padding: 10px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr style="border-bottom: 1px solid #ddd;">
                        <td style="padding: 10px;">101</td>
                        <td style="padding: 10px;">Rahul Sharma</td>
                        <td style="padding: 10px;">rahul@gmail.com</td>
                        <td style="padding: 10px;">Class 10</td>
                        <td style="padding: 10px;">
                            <button style="background: #2980b9; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Edit</button>
                            <button style="background: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
